<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tape · UI v1.1 Preview</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #0a0e12; color: #e8eef4; }
    main { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 1.35rem; font-weight: 600; letter-spacing: -0.02em; }
    p { color: #9aa7b5; line-height: 1.55; }
    a.cta {
      display: inline-block; margin: 8px 0 28px; padding: 12px 18px; border-radius: 10px;
      background: #14b8a6; color: #041016; font-weight: 600; text-decoration: none;
    }
    a.cta:hover { filter: brightness(1.06); }
    .grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
    @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
    figure { margin: 0; background: #111820; border: 1px solid #1e2a36; border-radius: 12px; overflow: hidden; }
    figcaption { padding: 10px 12px; font-size: 0.85rem; color: #9aa7b5; }
    img { width: 100%; display: block; }
    .note { font-size: 0.85rem; color: #6b7a8a; margin-top: 28px; }
  </style>
</head>
<body>
  <main>
    <h1>Tape · RH美股 Perp · UI v1.1</h1>
    <p>可点击前端壳（MOCK：开仓 / Overnight≤20 / 休市 / 有仓 / 停牌 / 1000×）+ 静态线框对照。</p>
    <a class="cta" href="./app/">打开可点击演示 →</a>
    <div class="grid">
      <figure><img src="./01-open.jpg" alt="开仓" /><figcaption>01 开仓</figcaption></figure>
      <figure><img src="./02-closed.jpg" alt="休市" /><figcaption>02 休市</figcaption></figure>
      <figure><img src="./03-position.jpg" alt="有仓" /><figcaption>03 有仓</figcaption></figure>
      <figure><img src="./04-halt.jpg" alt="停牌" /><figcaption>04 停牌</figcaption></figure>
      <figure><img src="./05-1000x-confirm.jpg" alt="1000x" /><figcaption>05 1000×确认</figcaption></figure>
      <figure><img src="./06-earnings.jpg" alt="收益" /><figcaption>06 收益</figcaption></figure>
    </div>
    <p class="note">演示数据为 MOCK；接链后换 env。视觉对齐 hf-v11。</p>
  </main>
</body>
</html>
